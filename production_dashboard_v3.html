<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生產線即時產量看板</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', '微軟正黑體', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 30px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 20px;
        }
        
        .header h1 {
            color: #333;
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #666;
            font-size: 14px;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }
        
        .file-input-wrapper input[type=file] {
            position: absolute;
            left: -9999px;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            border: 2px solid #ddd;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .stat-card h3 {
            font-size: 12px;
            opacity: 0.9;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .stat-card .value {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .stat-card .unit {
            font-size: 12px;
            opacity: 0.8;
        }
        
        .alert-card {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.3);
        }
        
        .alert-card h3 {
            font-size: 12px;
            opacity: 0.9;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        
        .alert-card .value {
            font-size: 24px;
            font-weight: bold;
        }
        
        .comparison-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }
        
        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }
        
        .chart-container {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .chart-container h2 {
            color: #333;
            font-size: 18px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }
        
        .chart-wrapper {
            position: relative;
            height: 400px;
        }
        
        .table-container {
            overflow-x: auto;
            background: #f9f9f9;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        
        table thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            position: sticky;
            top: 0;
        }
        
        table th {
            padding: 12px;
            text-align: left;
            font-weight: bold;
        }
        
        table td {
            padding: 10px 12px;
            border-bottom: 1px solid #e0e0e0;
        }
        
        table tbody tr:hover {
            background: #f5f5f5;
            transition: background 0.2s ease;
        }
        
        .progress-bar {
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            height: 20px;
            position: relative;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 11px;
            font-weight: bold;
            transition: width 0.3s ease;
            min-width: 30px;
        }
        
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
        }
        
        .status-ok {
            background: #d4edda;
            color: #155724;
        }
        
        .status-warning {
            background: #fff3cd;
            color: #856404;
        }
        
        .status-danger {
            background: #f8d7da;
            color: #721c24;
        }
        
        .summary-section {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .summary-section h2 {
            color: #333;
            font-size: 18px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }
        
        .warning-list {
            list-style: none;
        }
        
        .warning-list li {
            padding: 10px 15px;
            margin-bottom: 8px;
            background: white;
            border-left: 4px solid #f5576c;
            border-radius: 4px;
            font-size: 13px;
        }
        
        .warning-list li.achievable {
            border-left-color: #ffc107;
        }
        
        .warning-list li.severe {
            border-left-color: #dc3545;
            background: #fff5f5;
        }
        
        .warning-list li.success {
            border-left-color: #28a745;
            background: #f0f9f5;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }
        
        .data-info {
            background: #e7f3ff;
            border-left: 4px solid #2196F3;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
            font-size: 13px;
            color: #0c5aa0;
        }
        
        @media (max-width: 1024px) {
            .comparison-grid,
            .content-grid {
                grid-template-columns: 1fr;
            }
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            
            .header h1 {
                font-size: 24px;
            }
            
            .controls {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
            }
            
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 生產線即時產量看板</h1>
            <p>實時監控各產線生產進度 | 當前時間: <span id="currentTime"></span></p>
        </div>
        
        <div class="controls">
            <label class="file-input-wrapper btn btn-primary">
                📁 載入產量數據 (CSV)
                <input type="file" id="fileInput" accept=".csv" />
            </label>
            <button class="btn btn-secondary" onclick="clearData()">🔄 清除數據</button>
        </div>
        
        <div id="emptyState" class="empty-state">
            <p>👆 請上傳 CSV 文件開始</p>
            <p style="font-size: 12px; margin-top: 10px;">格式: 日期, 產線, 班別, 產量, 目標</p>
        </div>
        
        <div id="dashboard" style="display: none;">
            <div class="data-info" id="dataInfo"></div>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>當日總產量</h3>
                    <div class="value" id="totalOutput">0</div>
                    <div class="unit">件</div>
                </div>
                <div class="stat-card">
                    <h3>當日總目標</h3>
                    <div class="value" id="totalTarget">0</div>
                    <div class="unit">件</div>
                </div>
                <div class="stat-card">
                    <h3>整體達成率</h3>
                    <div class="value" id="overallRate">0%</div>
                    <div class="unit">達標</div>
                </div>
                <div class="alert-card">
                    <h3>⚠️ 落後產線</h3>
                    <div class="value" id="behindCount">0</div>
                </div>
            </div>
            
            <!-- 左右並排對比圖 -->
            <div class="comparison-grid">
                <div class="chart-container">
                    <h2>📊 目標產量</h2>
                    <div class="chart-wrapper">
                        <canvas id="targetChart"></canvas>
                    </div>
                </div>
                
                <div class="chart-container">
                    <h2>📈 實際產量</h2>
                    <div class="chart-wrapper">
                        <canvas id="actualChart"></canvas>
                    </div>
                </div>
            </div>
            
            <div class="content-grid">
                <div class="chart-container">
                    <h2>🎯 達成率分析</h2>
                    <div class="chart-wrapper">
                        <canvas id="rateChart"></canvas>
                    </div>
                </div>
                
                <div class="chart-container">
                    <h2>📊 目標 vs 實際並排</h2>
                    <div class="chart-wrapper">
                        <canvas id="comparisonChart"></canvas>
                    </div>
                </div>
            </div>
            
            <div class="summary-section">
                <h2>⚡ 實時預警</h2>
                <ul class="warning-list" id="warningList">
                    <li>無警告</li>
                </ul>
            </div>
            
            <div class="summary-section">
                <h2>📋 各線當日彙整</h2>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>日期</th>
                                <th>產線</th>
                                <th>班別數</th>
                                <th>實際產量</th>
                                <th>目標產量</th>
                                <th>達成率</th>
                                <th>狀態</th>
                                <th>預測</th>
                            </tr>
                        </thead>
                        <tbody id="dataTable">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let allData = [];
        let charts = {};
        
        // 日期格式統一化
        function formatDate(dateStr) {
            if (!dateStr) return '未知';
            
            // 嘗試多種格式轉換
            let date;
            
            // 格式：2026/1/1 或 2026/01/01
            if (dateStr.includes('/')) {
                const parts = dateStr.split('/');
                if (parts.length === 3) {
                    date = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
                }
            }
            // 格式：3-Apr-26
            else if (dateStr.includes('-')) {
                date = new Date(dateStr);
            }
            // 格式：20261010
            else if (dateStr.length === 8 && !isNaN(dateStr)) {
                const year = parseInt(dateStr.substring(0, 4));
                const month = parseInt(dateStr.substring(4, 6));
                const day = parseInt(dateStr.substring(6, 8));
                date = new Date(year, month - 1, day);
            }
            
            if (date && !isNaN(date)) {
                return date.toLocaleDateString('zh-TW', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit'
                });
            }
            
            return dateStr;
        }
        
        function updateTime() {
            const now = new Date();
            document.getElementById('currentTime').textContent = 
                now.toLocaleString('zh-TW', { 
                    hour12: false, 
                    year: 'numeric', 
                    month: '2-digit', 
                    day: '2-digit', 
                    hour: '2-digit', 
                    minute: '2-digit', 
                    second: '2-digit' 
                });
        }
        setInterval(updateTime, 1000);
        updateTime();
        
        document.getElementById('fileInput').addEventListener('change', handleFileUpload);
        
        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const csv = event.target.result;
                    allData = parseCSV(csv);
                    
                    if (allData.length > 0) {
                        document.getElementById('emptyState').style.display = 'none';
                        document.getElementById('dashboard').style.display = 'block';
                        updateDashboard();
                    } else {
                        alert('無有效數據，請檢查 CSV 格式');
                    }
                } catch (error) {
                    alert('文件解析失敗: ' + error.message);
                    console.error(error);
                }
            };
            reader.readAsText(file);
        }
        
        function parseCSV(csv) {
            const lines = csv.trim().split('\n');
            const data = [];
            
            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                
                const values = lines[i].split(',').map(v => v.trim());
                if (values.length < 5) continue;
                
                const output = parseInt(values[3]) || 0;
                const target = parseInt(values[4]) || 0;
                
                if (output === 0 && target === 0) continue;
                
                const row = {
                    date: formatDate(values[0]),
                    line: values[1] || '未知',
                    shift: values[2] || '未知',
                    output: output,
                    target: target
                };
                
                if (row.line && row.line !== '未知') {
                    data.push(row);
                }
            }
            
            return data;
        }
        
        function updateDashboard() {
            const lineData = {};
            let totalOutput = 0;
            let totalTarget = 0;
            let validRecords = 0;
            
            allData.forEach(row => {
                if (!lineData[row.line]) {
                    lineData[row.line] = { output: 0, target: 0, records: [] };
                }
                lineData[row.line].output += row.output;
                lineData[row.line].target += row.target;
                lineData[row.line].records.push(row);
                totalOutput += row.output;
                totalTarget += row.target;
                validRecords++;
            });
            
            document.getElementById('dataInfo').innerHTML = 
                `✅ 成功載入 <strong>${validRecords}</strong> 筆數據 | 產線數: <strong>${Object.keys(lineData).length}</strong>`;
            
            const overallRate = totalTarget > 0 ? Math.round((totalOutput / totalTarget) * 100) : 0;
            document.getElementById('totalOutput').textContent = totalOutput.toLocaleString();
            document.getElementById('totalTarget').textContent = totalTarget.toLocaleString();
            document.getElementById('overallRate').textContent = overallRate + '%';
            
            let behindCount = 0;
            const warnings = [];
            
            Object.keys(lineData).forEach(line => {
                const data = lineData[line];
                const rate = data.target > 0 ? Math.round((data.output / data.target) * 100) : 0;
                
                if (rate < 100) {
                    behindCount++;
                    const gap = Math.max(0, data.target - data.output);
                    const remainingShifts = Math.max(1, 3 - data.records.length);
                    const avgPerShift = data.records.length > 0 ? Math.round(data.output / data.records.length) : 0;
                    const projectedTotal = data.output + (avgPerShift * remainingShifts);
                    const canAchieve = projectedTotal >= data.target;
                    
                    warnings.push({
                        line,
                        gap,
                        rate,
                        canAchieve,
                        avgPerShift,
                        remainingShifts
                    });
                }
            });
            
            document.getElementById('behindCount').textContent = behindCount;
            
            updateWarnings(warnings);
            updateCharts(lineData);
            updateTable(lineData);
        }
        
        function updateWarnings(warnings) {
            const warningList = document.getElementById('warningList');
            warningList.innerHTML = '';
            
            if (warnings.length === 0) {
                warningList.innerHTML = '<li class="success">✅ 所有產線達成進度順利</li>';
                return;
            }
            
            warnings.sort((a, b) => a.rate - b.rate);
            
            warnings.forEach(w => {
                const li = document.createElement('li');
                li.className = w.canAchieve ? 'achievable' : 'severe';
                
                const forecast = w.canAchieve 
                    ? `✓ 可追上 (平均每班${w.avgPerShift}件，剩${w.remainingShifts}班)`
                    : `✗ 恐追不上 (差${w.gap}件，需要每班${Math.ceil(w.gap / w.remainingShifts)}件)`;
                
                li.innerHTML = `<strong>${w.line}</strong> - 達成率 ${w.rate}% (落後${w.gap}件) - ${forecast}`;
                warningList.appendChild(li);
            });
        }
        
        function updateCharts(lineData) {
            const lines = Object.keys(lineData).sort();
            const outputs = lines.map(l => lineData[l].output);
            const targets = lines.map(l => lineData[l].target);
            const rates = lines.map(l => {
                const data = lineData[l];
                return data.target > 0 ? Math.round((data.output / data.target) * 100) : 0;
            });
            
            // 目標產量圖
            if (charts.targetChart) charts.targetChart.destroy();
            const targetCtx = document.getElementById('targetChart').getContext('2d');
            charts.targetChart = new Chart(targetCtx, {
                type: 'bar',
                data: {
                    labels: lines,
                    datasets: [{
                        label: '目標產量',
                        data: targets,
                        backgroundColor: 'rgba(102, 126, 234, 0.8)',
                        borderColor: 'rgba(102, 126, 234, 1)',
                        borderWidth: 2,
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { 
                                color: '#666',
                                callback: function(value) {
                                    return value.toLocaleString();
                                }
                            },
                            grid: { color: 'rgba(0,0,0,0.05)' }
                        },
                        x: {
                            ticks: { color: '#666', font: { weight: 'bold' } },
                            grid: { display: false }
                        }
                    }
                }
            });
            
            // 實際產量圖
            if (charts.actualChart) charts.actualChart.destroy();
            const actualCtx = document.getElementById('actualChart').getContext('2d');
            charts.actualChart = new Chart(actualCtx, {
                type: 'bar',
                data: {
                    labels: lines,
                    datasets: [{
                        label: '實際產量',
                        data: outputs,
                        backgroundColor: 'rgba(76, 175, 80, 0.8)',
                        borderColor: 'rgba(76, 175, 80, 1)',
                        borderWidth: 2,
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { 
                                color: '#666',
                                callback: function(value) {
                                    return value.toLocaleString();
                                }
                            },
                            grid: { color: 'rgba(0,0,0,0.05)' }
                        },
                        x: {
                            ticks: { color: '#666', font: { weight: 'bold' } },
                            grid: { display: false }
                        }
                    }
                }
            });
            
            // 達成率圖
            if (charts.rateChart) charts.rateChart.destroy();
            const rateCtx = document.getElementById('rateChart').getContext('2d');
            charts.rateChart = new Chart(rateCtx, {
                type: 'bar',
                data: {
                    labels: lines,
                    datasets: [{
                        label: '達成率 (%)',
                        data: rates,
                        backgroundColor: rates.map(r => 
                            r >= 100 ? 'rgba(76, 175, 80, 0.8)' :
                            r >= 80 ? 'rgba(255, 193, 7, 0.8)' :
                            'rgba(244, 67, 54, 0.8)'
                        ),
                        borderWidth: 2,
                        borderColor: rates.map(r =>
                            r >= 100 ? 'rgba(76, 175, 80, 1)' :
                            r >= 80 ? 'rgba(255, 193, 7, 1)' :
                            'rgba(244, 67, 54, 1)'
                        ),
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: {
                            max: 120,
                            beginAtZero: true,
                            ticks: { color: '#666' },
                            grid: { color: 'rgba(0,0,0,0.05)' }
                        },
                        x: {
                            ticks: { color: '#666' },
                            grid: { display: false }
                        }
                    }
                }
            });
            
            // 並排對比圖
            if (charts.comparisonChart) charts.comparisonChart.destroy();
            const comparisonCtx = document.getElementById('comparisonChart').getContext('2d');
            charts.comparisonChart = new Chart(comparisonCtx, {
                type: 'bar',
                data: {
                    labels: lines,
                    datasets: [
                        {
                            label: '目標',
                            data: targets,
                            backgroundColor: 'rgba(102, 126, 234, 0.8)',
                            borderColor: 'rgba(102, 126, 234, 1)',
                            borderWidth: 2,
                            borderRadius: 6
                        },
                        {
                            label: '實際',
                            data: outputs,
                            backgroundColor: 'rgba(76, 175, 80, 0.8)',
                            borderColor: 'rgba(76, 175, 80, 1)',
                            borderWidth: 2,
                            borderRadius: 6
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'top',
                            labels: { usePointStyle: true }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { color: '#666' },
                            grid: { color: 'rgba(0,0,0,0.05)' }
                        },
                        x: {
                            ticks: { color: '#666' },
                            grid: { display: false }
                        }
                    }
                }
            });
        }
        
        function updateTable(lineData) {
            const tbody = document.getElementById('dataTable');
            tbody.innerHTML = '';
            
            const summaryData = [];
            Object.keys(lineData).forEach(line => {
                const data = lineData[line];
                const rate = data.target > 0 ? Math.round((data.output / data.target) * 100) : 0;
                const lastRecord = data.records[data.records.length - 1];
                
                const gap = Math.max(0, data.target - data.output);
                const remainingShifts = Math.max(1, 3 - data.records.length);
                const avgPerShift = data.records.length > 0 ? Math.round(data.output / data.records.length) : 0;
                const canAchieve = (data.output + avgPerShift * remainingShifts) >= data.target;
                
                summaryData.push({
                    date: lastRecord.date,
                    line: line,
                    shiftCount: data.records.length,
                    output: data.output,
                    target: data.target,
                    rate: rate,
                    status: rate >= 100 ? 'ok' : rate >= 80 ? 'warning' : 'danger',
                    forecast: canAchieve ? '✓ 可達成' : '✗ 難達成'
                });
            });
            
            summaryData.sort((a, b) => a.rate - b.rate);
            
            summaryData.forEach(row => {
                const tr = document.createElement('tr');
                const progressPercent = Math.min(row.rate, 100);
                
                tr.innerHTML = `
                    <td>${row.date}</td>
                    <td><strong>${row.line}</strong></td>
                    <td>${row.shiftCount}/3班</td>
                    <td>${row.output.toLocaleString()}</td>
                    <td>${row.target.toLocaleString()}</td>
                    <td>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${progressPercent}%">
                                ${row.rate}%
                            </div>
                        </div>
                    </td>
                    <td>
                        <span class="status-badge status-${row.status}">
                            ${row.rate >= 100 ? '✓ 達成' : row.rate >= 80 ? '⚠️ 注意' : '✗ 落後'}
                        </span>
                    </td>
                    <td>${row.forecast}</td>
                `;
                tbody.appendChild(tr);
            });
        }
        
        function clearData() {
            allData = [];
            document.getElementById('fileInput').value = '';
            document.getElementById('emptyState').style.display = 'block';
            document.getElementById('dashboard').style.display = 'none';
            
            Object.values(charts).forEach(chart => {
                if (chart) chart.destroy();
            });
        }
    </script>
</body>
</html>
